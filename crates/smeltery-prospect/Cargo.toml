[package]
name = "smeltery-prospect"
description = "Prospect, the full-text search of the Smeltery framework: searchable models, the database driver (SQLite FTS5, PostgreSQL tsvector, MySQL FULLTEXT), ranking, highlights, scopes and pagination."
readme = "README.md"
keywords = ["search", "full-text", "fts5", "orm", "smeltery"]
categories = ["web-programming", "database"]
exclude = ["CLAUDE.md", "docs/", "/target", ".github/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Not for apps: builds the PostgreSQL and MySQL runs of the search suite (`tests/backends.rs`, `DATABASE_URL_PG` /
# `DATABASE_URL_MYSQL`), so other test builds compile the core without those backends.
backend-tests = ["smeltery-core/postgres", "smeltery-core/mysql"]

[dependencies]
axum.workspace = true
http.workspace = true
# Entities, `sea_query` statements and the column types of a model (the workspace pin).
sea-orm = { workspace = true, features = ["with-chrono"] }
serde.workspace = true
serde_json.workspace = true
smeltery-core.workspace = true
thiserror.workspace = true
# The MySQL token size, read once per process.
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
# The facade, for the doc samples: they use `smeltery::…` paths. Path only, no version: Cargo leaves it out of the published package (D-140).
smeltery = { path = "../smeltery", default-features = false }
smeltery-core = { workspace = true, features = ["sqlite"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
