[package]
name = "smeltery-mold-macros"
description = "The #[derive(Mold)] macro of the Smeltery framework: compiles Mold templates to Rust at build time."
readme = "README.md"
keywords = ["template", "html", "derive", "smeltery", "mold"]
categories = ["template-engine", "web-programming"]
exclude = ["CLAUDE.md", "docs/", "/target", ".github/", "/resources/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
smeltery-mold.workspace = true
syn.workspace = true

[dev-dependencies]
# The facade, for the doc samples: the derive expands to `::smeltery::…` paths. Path only, no version: Cargo leaves it out of the published package (D-140).
smeltery = { path = "../smeltery", default-features = false }
serde.workspace = true
serde_json.workspace = true
smeltery-mold.workspace = true
trybuild.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
