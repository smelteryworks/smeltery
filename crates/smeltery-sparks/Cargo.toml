[package]
name = "smeltery-sparks"
description = "Sparks, the live components of the Smeltery framework: Rust state and actions with a Mold view, kept in sync with the browser by a small client runtime, with server push and file uploads."
readme = "README.md"
keywords = ["live", "components", "reactive", "web", "smeltery"]
categories = ["web-programming", "web-programming::http-server"]
exclude = ["CLAUDE.md", "docs/", "/target", ".github/", "/resources/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
axum = { workspace = true, features = ["tokio", "json", "query"] }
base64.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["std"] }
getrandom.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
smeltery-core.workspace = true
smeltery-mold.workspace = true
smeltery-mold-macros.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "fs", "io-util", "macros", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
# The facade, for the doc samples: they use `smeltery::prelude::*` and the derives expand to `::smeltery::…` paths. Path only, no version: Cargo leaves it out of the published package (D-140).
smeltery = { path = "../smeltery", default-features = false }
smeltery-macros.workspace = true
# SQLite for the cross-process push test (two apps on one database file).
smeltery-core = { workspace = true, features = ["sqlite"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
