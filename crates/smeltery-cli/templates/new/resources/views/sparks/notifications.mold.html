<div class="panel text-sm text-stone-700 dark:text-stone-300">
  <h3 class="mb-2 text-base font-semibold text-forge-900 dark:text-ash-100">Live</h3>
  <p>Your private channel <code>private-users.{{ user_id }}</code>, through a Spark (<code>app/sparks/notifications.rs</code>) and no JavaScript of your own.</p>
  <button type="button" wire:click="ping" class="btn-secondary mt-3">Notify me</button>
  <ul class="mt-3 space-y-1" aria-live="polite">
    @for(message in messages)
      <li>{{ message }}</li>
    @endfor
  </ul>
</div>
