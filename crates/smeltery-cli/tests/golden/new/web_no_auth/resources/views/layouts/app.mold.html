<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>@yield("title", "My App")</title>
    <link rel="stylesheet" href="/assets/css/app.css">
    @sparksScripts
  </head>
  <body class="forge-page flex flex-col">
    <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:rounded-lg focus:bg-white focus:px-3 focus:py-2 focus:text-forge-900">Skip to content</a>
    <header class="border-b border-ash-200/80 dark:border-forge-800/80">
      <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6" aria-label="Main">
        <a href="/" class="flex items-center gap-2.5 font-semibold tracking-tight focus-visible:outline-2 focus-visible:outline-molten-500">
          <svg class="h-7 w-7" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="logo-molten" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ff4a1c"/><stop offset="1" stop-color="#a3260f"/></linearGradient></defs><path d="M16 4 28 10v12l-12 6-12-6V10z" fill="url(#logo-molten)"/><path d="M16 4 28 10l-12 6-12-6z" fill="#ffd27a" opacity=".55"/></svg>
          <span>My App</span>
        </a>
      </nav>
    </header>
    @if(session("status"))
      <div class="mx-auto w-full max-w-6xl px-4 pt-6 sm:px-6">
        <p class="alert-success" role="status">{{ session("status") }}</p>
      </div>
    @endif
    @if(session("error"))
      <div class="mx-auto w-full max-w-6xl px-4 pt-6 sm:px-6">
        <p class="alert-error" role="alert">{{ session("error") }}</p>
      </div>
    @endif
    <div id="main" class="flex-1">
      @yield("content")
    </div>
    <footer class="border-t border-ash-200/80 dark:border-forge-800/80">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-2 px-4 py-6 text-sm text-stone-600 sm:px-6 dark:text-stone-400">
        <p>Built with <a href="https://github.com/smelteryworks/smeltery" class="link">Smeltery</a>, the Rust web framework.</p>
        <p class="font-mono text-xs">Rust · Mold · Sparks</p>
      </div>
    </footer>
  </body>
</html>
