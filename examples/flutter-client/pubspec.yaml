name: flutter_client
description: "An example Flutter client of a Smeltery app's Anvil socket (Pusher protocol 7) with Hallmark API tokens."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  anvil_link:
    path: packages/anvil_link
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
